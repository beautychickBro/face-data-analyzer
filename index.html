<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ed">
<title>捏脸数据分析 · 口令码对比</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#fafafa;--surface:#fff;--ink:#161616;--muted:#626262;--line:#dedede;--pink:#ffbcca;--difference:#fff0f4;--missing:#f2effa;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-size:16px;line-height:1.6;background-color:var(--bg);background-image:radial-gradient(#d8d8d8 .75px,transparent .75px);background-size:18px 18px}
main{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:24px;width:min(1200px,calc(100% - 64px));margin:40px auto 48px}
main>header{min-width:0}
main>.input-card,main>#status,main>#result{grid-column:1/-1;min-width:0}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.3;letter-spacing:-.04em;font-weight:750}
h2{font-size:21px;line-height:1.4;letter-spacing:-.025em}
h3{font-size:17px}
button,textarea,select,input{font:inherit}
button{min-height:44px;padding:9px 22px;border:1px solid transparent;border-radius:999px;background:#d9d9d9;color:var(--ink);font-weight:650;cursor:pointer;transition:background-color .15s,border-color .15s}
button:hover:enabled{background:#ccc}
button:disabled,select:disabled,input:disabled,textarea:disabled{opacity:.55;cursor:wait}
button.secondary{background:#d9d9d9;color:var(--ink)}
button.secondary:hover:enabled{background:#ccc}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #963750;outline-offset:3px}
.mode-switch{display:inline-flex;justify-self:end;gap:4px;padding:4px;border:1px solid #d7d7d7;border-radius:999px;background:#ececec}
.mode-switch button{min-width:116px;min-height:38px;padding:7px 18px;border:0;background:transparent;color:var(--muted);font-size:14px}
.mode-switch button:hover:enabled{background:#e1e1e1}
.mode-switch button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0000000d}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.download-tool{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;color:#777;text-decoration:none}
.download-tool:hover{background:#ededed;color:var(--ink)}
.download-tool:focus-visible{outline:3px solid #963750;outline-offset:3px}
.download-tool svg{display:block;width:18px;height:18px}
.input-card{margin-top:24px;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.input-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.input-grid>div{min-width:0}
.input-grid.single{grid-template-columns:minmax(0,1fr)}
.input-label{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:15px;font-weight:650}
.letter{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid #e7b8c3;border-radius:8px;background:#ffe0e8;color:#562333;font:600 13px/1 var(--mono)}
.letter-b{border-color:#d7d0e5;background:#eae5f3;color:#423454}
textarea{display:block;width:100%;min-height:128px;padding:15px 16px;border:1px solid #d2d2d2;border-radius:12px;background:#f8f8f8;color:var(--ink);font:14px/1.75 var(--mono);resize:vertical;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s}
textarea::placeholder{color:#777}
textarea:focus{background:#fff;border-color:#a24c64}
textarea[aria-invalid="true"]{border-color:#ad3446}
.field-status{margin-top:8px;color:var(--muted);font-size:13px}
.field-status.error,.error{color:#a32b3e}
.form-actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:18px}
.hint{color:var(--muted);font-size:13px}
.primary-action{min-width:164px;background:var(--pink);color:var(--ink)}
.primary-action:hover:enabled{background:#ffaec0}
#status{margin:14px 2px 0;color:var(--muted);font-size:14px}
#status.error{color:#a32b3e}
#result{margin-top:24px}
.panel{min-width:0;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.section-heading button{min-height:40px;padding:8px 18px;font-size:14px}
.count-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 0}
.count-card{min-width:0;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fafafa}
.count-card dt{display:flex;flex-direction:column;justify-content:flex-end;min-height:40px;color:#515151;font-size:14px;line-height:1.4}
.count-scope{color:var(--muted);font-size:12px}
.count-card dd{display:flex;align-items:baseline;gap:6px;margin:8px 0 0;min-width:0}
.count-number{min-width:0;font:600 40px/1.2 var(--mono);letter-spacing:-.06em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.count-unit{flex:none;color:var(--muted);font-size:13px}
.detail-panel{margin-top:24px;padding:0;border:0;background:transparent}
.table-top{padding:0 2px 16px}
.table-controls{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin-top:16px}
.check-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
input[type="checkbox"]{width:17px;height:17px;margin:0;accent-color:#74394c}
.select-label{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
select{min-height:38px;max-width:100%;padding:7px 30px 7px 12px;border:1px solid #d5d5d5;border-radius:9px;background:#f6f6f6;color:var(--ink);font-size:13px}
#detail-groups{display:grid;gap:16px;min-width:0}
.detail-category{min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.category-summary{display:flex;align-items:center;gap:12px;padding:19px 22px;cursor:pointer;list-style:none;font-size:19px;font-weight:700}
.category-summary::-webkit-details-marker{display:none}
.category-summary:focus-visible{outline-offset:-4px;border-radius:17px}
.category-summary::after{content:'';width:7px;height:7px;flex:none;border-right:1.5px solid #777;border-bottom:1.5px solid #777;transform:rotate(45deg);margin-right:3px}
.detail-category[open]>.category-summary::after{transform:rotate(225deg)}
.category-count{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}
.group-content{padding:0 22px 18px}
.detail-part{min-width:0}
.detail-part+.detail-part{margin-top:18px}
.part-heading{padding:11px 0;border-top:1px solid var(--line);font-size:16px;font-weight:650}
.detail-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px;padding:13px 0;border-top:1px solid #efefef;min-width:0}
.row-meta{min-width:0}
.parameter-name{font-size:16px;font-weight:550;overflow-wrap:anywhere}
.row-side{display:inline-block;margin-left:9px;color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap}
.row-id{display:block;margin-top:4px;color:#777;font:11px/1.5 var(--mono);overflow-wrap:anywhere}
.row-badge{display:inline-block;margin-left:7px;padding:1px 5px;border-radius:5px;background:#eee5e9;color:#6d3c4d;font-size:11px;font-weight:400;vertical-align:middle}
.row-values{display:flex;align-items:flex-start;gap:12px;flex:none}
.value-column{width:72px;flex:none;text-align:center}
.value-label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px;line-height:16px}
.value-circle{display:inline-grid;place-items:center;width:48px;height:48px;border:1px solid #d6d6d6;border-radius:50%;background:#f6f6f6;color:var(--ink);font:550 20px/1 var(--mono);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.detail-row.changed .value-circle{border:2px solid #ce6a88;background:#fff4f7}
.value-circle.is-missing{border:1.5px dashed #b5a5c8;background:#f8f6fc;color:#766886}
.calibrated{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:16px;white-space:nowrap}
.delta-tag{display:inline-grid;place-items:center;min-width:50px;min-height:28px;padding:3px 8px;margin-top:31px;border-radius:8px;background:#f0f0f0;color:#555;font:500 14px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.detail-row.changed .delta-tag{background:#f9eaf0;color:#7d304a}
.empty-details{margin:0;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted);text-align:center}
#copy-text{min-height:250px;margin-top:18px}
.field-status:empty,#status:empty{display:none}
@media(max-width:920px){
  main{width:calc(100% - 40px);margin-top:28px}
}
@media(max-width:620px){
  main{position:relative;grid-template-columns:minmax(0,1fr);width:calc(100% - 28px);margin:24px auto 32px}
  h1{font-size:26px}
  h2{font-size:20px}
  .mode-switch{justify-self:start;max-width:100%;margin-top:18px}
  .header-actions{justify-content:flex-start;min-width:0}
  .download-tool{position:absolute;top:0;right:0}
  .mode-switch button{min-width:120px;padding:7px 16px}
  .input-card{margin-top:18px;padding:18px;border-radius:17px}
  .input-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  textarea{min-height:112px;padding:13px 14px}
  .form-actions{margin-top:16px}
  .primary-action{width:100%}
  #result{margin-top:20px}
  .panel{padding:18px;border-radius:17px}
  .section-heading{gap:12px}
  .section-heading button{padding:8px 14px;font-size:13px}
  .count-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
  .count-card{padding:14px}
  .count-card dt{font-size:13px;min-height:36px}
  .count-number{font-size:36px}
  .count-scope{font-size:11px}
  .detail-panel{padding:0}
  .table-top{padding:0 2px 14px}
  .category-summary{padding:17px 18px;font-size:18px}
  .group-content{padding:0 18px 14px}
  .detail-row{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 0}
  .row-values{gap:10px;justify-self:start}
  .value-column{width:64px}
  .delta-tag{min-width:48px}
  .parameter-name{font-size:16px}
  .table-controls{gap:14px}
  .select-label{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>捏脸数据对比</h1>
  </header>
  <div class="header-actions">
    <div class="mode-switch" role="group" aria-label="分析模式">
      <button id="mode-compare" type="button" aria-pressed="true">双码对比</button>
      <button id="mode-single" type="button" aria-pressed="false">单码提取</button>
    </div>
    <a id="download-tool" class="download-tool" href="./index.html" download="FaceDataAnalyzer.html" aria-label="Download tool" title="Download tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg></a>
  </div>
  <form id="form" class="input-card">
    <div id="input-grid" class="input-grid">
      <div>
        <label class="input-label" for="code-a"><span class="letter" aria-hidden="true">A</span><span id="label-a">口令码 A</span></label>
        <textarea id="code-a" spellcheck="false" autocomplete="off" placeholder="粘贴口令码…" aria-describedby="status-a"></textarea>
        <p id="status-a" class="field-status" role="status" aria-live="polite"></p>
      </div>
      <div id="input-b">
        <label class="input-label" for="code-b"><span class="letter letter-b" aria-hidden="true">B</span>口令码 B</label>
        <textarea id="code-b" spellcheck="false" autocomplete="off" placeholder="粘贴口令码…" aria-describedby="status-b"></textarea>
        <p id="status-b" class="field-status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="form-actions">
      <button id="submit" class="primary-action" type="submit">一键对比</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-label="分析结果">
    <div class="panel">
      <div class="section-heading">
        <h2 id="result-title">对比结果</h2>
        <button id="copy-all" class="secondary" type="button">复制完整报告</button>
      </div>
      <div id="comparison-summary">
        <dl class="count-cards">
          <div class="count-card"><dt>完全相同</dt><dd><span id="count-same" class="count-number"></span><span class="count-unit">项</span></dd></div>
          <div class="count-card"><dt>不同</dt><dd><span id="count-changed" class="count-number"></span><span class="count-unit">项</span></dd></div>
          <div class="count-card"><dt><span class="count-scope">排除含50项</span>相同</dt><dd><span id="count-non-default-same" class="count-number"></span><span class="count-unit">项</span></dd></div>
          <div class="count-card"><dt><span class="count-scope">排除含50项</span>差值1～5</dt><dd><span id="count-non-default-near" class="count-number"></span><span class="count-unit">项</span></dd></div>
        </dl>
      </div>
      <textarea id="copy-text" hidden readonly aria-label="完整报告，可手动复制"></textarea>
    </div>
    <div class="panel detail-panel">
      <div class="table-top">
        <div class="section-heading"><h2 id="detail-title">参数明细</h2><span id="table-count" class="hint"></span></div>
        <div id="table-controls" class="table-controls">
          <label class="check-label"><input id="differences-only" type="checkbox" checked>只看差异与缺失</label>
          <label class="select-label" for="sort-order">排序<select id="sort-order"><option value="difference">绝对差从大到小</option><option value="part">部位顺序</option></select></label>
        </div>
      </div>
      <div id="detail-groups"></div>
    </div>
  </section>
</main>

[32,'嘴角',[[1,'间距'],[2,'高度'],[3,'前后'],[7,'宽度'],[8,'厚度'],[5,'倾斜'],[6,'外翻'],[4,'角度'],[9,'饱满']]],
[33,'耳朵整体',[[2,'间距'],[3,'高低'],[4,'前后'],[1,'大小'],[6,'外翻'],[7,'倾斜'],[5,'角度']]],
[34,'耳廓',[[1,'间距'],[2,'高低'],[3,'前后'],[4,'角度']]],
[35,'耳垂',[[2,'间距'],[3,'高低'],[4,'前后'],[1,'大小'],[5,'角度']]]
];
const groupMap=new Map(GROUPS.map(([id,name,fields],order)=>[id,{name,order}]));
const DETAIL_CATEGORIES=[
  ['face','脸型',[52,1,41,2,3,4,6,5,42,10,11,43,44,8,9]],
  ['eyes','眉眼',[45,36,12,13,14,15,53,16,17,18,19,20]],
  ['nose','鼻部',[21,26,24,49,50,46,22,23,25]],
  ['mouth','嘴部',[7,27,51,47,28,29,48,30,31,32]],
  ['ears','耳部',[33,34,35]]
];
const detailCategoryMap=new Map();
DETAIL_CATEGORIES.forEach(([key,name,groups],order)=>groups.forEach((group,groupOrder)=>detailCategoryMap.set(group,{key,name,order,groupOrder})));
const bilateral=new Set([41,3,7,4,6,5,10,11,9,45,36,12,13,14,15,53,16,17,18,19,20,50,23,51,29,31,32,33,34,35]);
const fieldMap=new Map();for(const [gid,,fields] of GROUPS)fields.forEach(([ids,name,reason],order)=>{for(const cid of [].concat(ids))fieldMap.set(`${gid}:${cid}`,{name,reason:reason||'',order});});
const verified=new Map([['21:6',{60:85}],['46:6',{35:50}],['22:4',{35:50}],['23:1',{35:50}],['23:9',{35:50}]]);
const display=(v,id)=>verified.get(id)?.[v]===undefined?String(v):`${v}（界面${verified.get(id)[v]}）`;
const key=new TextEncoder().encode('netease_hex_xor_encrypt_key');
const sources=['https://h72.fp.ps.netease.com/file/','https://h72wxj.fp.ps.netease.com/file/'];
class DataError extends Error{constructor(s,code='INVALID'){super(s);this.code=code}}
function parseRecords(bytes){let out=[],seen=new Set(),p=0;while(p<bytes.length){if(p+3>bytes.length)throw new DataError('数据记录不完整。');let group=bytes[p++],control=bytes[p++],count=bytes[p++];if(!count||p+count*2>bytes.length)throw new DataError('数值区段不完整。');let slots={};for(let i=0;i<count;i++){let slot=String(bytes[p++]),v=bytes[p++];if(Object.hasOwn(slots,slot))throw new DataError('存在重复槽位。');slots[slot]=v}let id=`${group}:${control}`;if(seen.has(id))throw new DataError('存在重复编号。');seen.add(id);out.push({group,control,slots});if(out.length>2048)throw new DataError('数据量过大。')}if(!out.length)throw new DataError('未读取到参数。');return out}
async function unpack(encoded){if(!('DecompressionStream' in window))throw new DataError('请使用新版浏览器。');let binary;try{binary=atob(encoded)}catch{throw new DataError('编码不完整。')}let bytes=Uint8Array.from(binary,(ch,i)=>ch.charCodeAt(0)^key[i%key.length]);try{let reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')).getReader(),chunks=[],size=0;while(true){let {done,value}=await reader.read();if(done)break;size+=value.length;if(size>1048576){await reader.cancel();throw new DataError('解包数据过大。')}chunks.push(value)}let out=new Uint8Array(size),p=0;for(let c of chunks){out.set(c,p);p+=c.length}return out}catch(e){throw e instanceof DataError?e:new DataError('数据校验失败或格式不支持。')}}
async function decodeShare(share){if(typeof share?.face_data!=='string')throw new DataError('数据格式不正确。');let parts=share.face_data.trim().split('|*|'),fmt=parts[0]?.slice(0,3);if(fmt!=='R67')throw new DataError(`仅支持 R67 数据格式，当前为 ${fmt||'未知'}。`);if(parts.length!==5&&parts.length!==6)throw new DataError('数据区段不完整。');let records=parseRecords(await unpack(parts[0].slice(3)));for(let part of [parts[1],parts[2],...parts.slice(4)])await unpack(part);if(!/^\d+$/.test(parts[3]))throw new DataError('附加标记不完整。');return records}
async function extractShare(input){let s=input.trim();if(!s)throw new DataError('请粘贴完整数据。');if(s.length>10000)throw new DataError('输入过长。');let match=s.match(/yysls_facedata_R\d+_([A-Za-z0-9]{24,90})/);if(!match)throw new DataError('未识别到标准长格式数据。');let last;for(let source of sources){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{let res=await fetch(source+match[1],{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer',mode:'cors'});if(!res.ok){last=new DataError(res.status===404?'分享数据已失效。':'数据来源暂不可用。','NETWORK');continue}let text=await res.text();if(text.length>1048576)throw new DataError('文件超出预期大小。');let share;try{share=JSON.parse(text)}catch{throw new DataError('返回数据格式错误。')}return await decodeShare(share)}catch(e){if(e instanceof DataError&&e.code!=='NETWORK')throw e;last=e}finally{clearTimeout(timer)}}throw last instanceof DataError?last:new DataError('网络读取失败，请稍后再试。')}

const $=id=>document.getElementById(id);
$('download-tool').href=location.href.split('#')[0];
const ui={form:$('form'),a:$('code-a'),b:$('code-b'),submit:$('submit'),result:$('result'),status:$('status'),copy:$('copy-all'),copyText:$('copy-text'),only:$('differences-only'),sort:$('sort-order')};
let mode='compare',busy=false,currentReport=null;
const detailOpenState=new Map();

function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function partOrder(a,b){return a.order-b.order||a.fieldOrder-b.fieldOrder||a.group-b.group||a.control-b.control||Number(a.slot)-Number(b.slot);}
function flattenRecords(records){
  const rows=[];
  for(const record of records){
    const id=`${record.group}:${record.control}`,group=groupMap.get(record.group),field=fieldMap.get(id);
    for(const [slot,value] of Object.entries(record.slots)){
      const side=field&&bilateral.has(record.group)&&(slot==='1'||slot==='2')?(slot==='1'?'左':'右'):`槽位 ${slot}`;
      rows.push({key:`${id}:${slot}`,id,group:record.group,control:record.control,slot,value,side,part:group?.name||`未对应部位 ${record.group}`,field:field?.name||`参数 ${record.control}`,pending:!field||!!field.reason,order:group?.order??999,fieldOrder:field?.order??999});
    }
  }
  return rows.sort(partOrder);
}
function compareRecords(recordsA,recordsB){
  const a=new Map(flattenRecords(recordsA).map(row=>[row.key,row])),b=new Map(flattenRecords(recordsB).map(row=>[row.key,row]));
  const stats={rows:[],same:0,changed:0,nonDefaultSame:0,nonDefaultNear:0,onlyA:0,onlyB:0,common:0,total:0};
  for(const key of new Set([...a.keys(),...b.keys()])){
    const rowA=a.get(key),rowB=b.get(key),meta=rowA||rowB;
    const row={...meta,a:rowA?.value,b:rowB?.value,delta:null,absolute:null,state:''};
    if(!rowA){row.state='missingA';stats.onlyB++;}
    else if(!rowB){row.state='missingB';stats.onlyA++;}
    else{
      row.delta=row.b-row.a;row.absolute=Math.abs(row.delta);stats.common++;
      row.state=row.absolute===0?'same':'changed';stats[row.state]++;
      if(row.a!==50&&row.b!==50){
        if(row.absolute===0)stats.nonDefaultSame++;
        else if(row.absolute>=1&&row.absolute<=5)stats.nonDefaultNear++;
      }
    }
    stats.rows.push(row);
  }
  stats.rows.sort(partOrder);stats.total=stats.rows.length;
  return stats;
}
function signed(value){return value>0?`+${value}`:String(value);}
function comparisonSummary(stats){
  return `共同项中完全相同 ${stats.same} 项、不同 ${stats.changed} 项；排除含 50 的项后，相同 ${stats.nonDefaultSame} 项、差值在 1～5 的 ${stats.nonDefaultNear} 项。`;
}
function detailSections(rows,sortDifferences=false){
  const categories=new Map();
  for(const row of rows){
    const category=detailCategoryMap.get(row.group)||{key:'other',name:'其他',order:DETAIL_CATEGORIES.length,groupOrder:row.group};
    if(!categories.has(category.key))categories.set(category.key,{...category,parts:new Map(),count:0});
    const section=categories.get(category.key);section.count++;
    if(!section.parts.has(row.group))section.parts.set(row.group,{group:row.group,name:row.part,order:category.groupOrder,rows:[]});
    section.parts.get(row.group).rows.push(row);
  }
  return [...categories.values()].sort((a,b)=>a.order-b.order).map(section=>({...section,parts:[...section.parts.values()].sort((a,b)=>a.order-b.order||a.group-b.group).map(part=>({...part,rows:part.rows.sort(sortDifferences?(a,b)=>(b.absolute??-1)-(a.absolute??-1)||partOrder(a,b):partOrder)}))}));
}
function valueBadge(value,id,label){
  const column=element('div',undefined,'value-column');
  column.append(element('span',label,'value-label'));
  const circle=element('span',value===undefined?'—':String(value),`value-circle${value===undefined?' is-missing':''}`);
  circle.setAttribute('aria-label',`${label} 原始值 ${value===undefined?'未记录':value}`);column.append(circle);
  if(value!==undefined&&verified.get(id)?.[value]!==undefined)column.append(element('span',`界面 ${verified.get(id)[value]}`,'calibrated'));
  return column;
}
function detailRow(row,compare){
  const item=element('div',undefined,`detail-row${compare?' '+row.state:''}`);item.dataset.key=row.key;
  const metadata=element('div',undefined,'row-meta'),name=element('div',row.field,'parameter-name');
  name.append(element('span',row.side,'row-side'));
  if(row.pending)name.append(element('span','待校对','row-badge'));
  metadata.append(name,element('span',row.key,'row-id'));
  const values=element('div',undefined,'row-values');
  if(compare){
    values.append(valueBadge(row.a,row.id,'A'),valueBadge(row.b,row.id,'B'));
    const delta=element('span',row.delta===null?'—':signed(row.delta),'delta-tag');
    delta.setAttribute('aria-label',row.delta===null?'差值无法计算':`差值 B 减 A ${signed(row.delta)}`);values.append(delta);
  }else values.append(valueBadge(row.value,row.id,'原始值'));
  item.append(metadata,values);return item;
}
function renderTable(resetOpen=false){
  if(!currentReport)return;
  if(resetOpen===true)detailOpenState.clear();
  else for(const details of document.querySelectorAll('#detail-groups > .detail-category'))detailOpenState.set(details.dataset.category,details.open);
  const compare=currentReport.mode==='compare',stats=currentReport.stats;
  let rows=compare?stats.rows.slice():currentReport.rows.slice();
  if(compare&&ui.only.checked)rows=rows.filter(row=>row.state!=='same');
  const sections=detailSections(rows,compare&&ui.sort.value==='difference'),fragment=document.createDocumentFragment();
  for(const section of sections){
    const details=element('details',undefined,'detail-category');details.dataset.category=section.key;details.open=detailOpenState.get(section.key)??true;
    details.addEventListener('toggle',()=>{if(details.isConnected)detailOpenState.set(section.key,details.open);});
    const heading=element('summary',undefined,'category-summary');heading.append(element('span',section.name),element('span',`${section.count} 项`,'category-count'));
    const content=element('div',undefined,'group-content');
    for(const part of section.parts){
      const block=element('section',undefined,'detail-part');block.dataset.group=String(part.group);block.append(element('h3',part.name,'part-heading'));
      for(const row of part.rows)block.append(detailRow(row,compare));
      content.append(block);
    }
    details.append(heading,content);fragment.append(details);
  }
  if(!rows.length)fragment.append(element('p',compare&&ui.only.checked?'无差异':'无参数','empty-details'));
  $('detail-groups').replaceChildren(fragment);
  $('table-count').textContent=compare?`显示 ${rows.length} / ${stats.total} 项`:`共 ${rows.length} 个槽位`;
}
function renderComparison(report){
  $('result-title').textContent='对比结果';
  $('comparison-summary').hidden=false;$('table-controls').hidden=false;
  $('count-same').textContent=report.stats.same;$('count-changed').textContent=report.stats.changed;
  $('count-non-default-same').textContent=report.stats.nonDefaultSame;$('count-non-default-near').textContent=report.stats.nonDefaultNear;
  $('detail-title').textContent='参数明细';
  ui.only.checked=true;ui.sort.value='difference';renderTable(true);
}
function renderSingle(report){
  $('result-title').textContent='提取结果';
  $('comparison-summary').hidden=true;$('table-controls').hidden=true;
  $('detail-title').textContent='参数明细';renderTable(true);
}
function appendReportRows(lines,rows,compare){
  for(const category of detailSections(rows)){
    lines.push('',`【${category.name}】`);
    for(const part of category.parts){
      lines.push(`〔${part.name}〕`,compare?'参数\t侧别 / 槽位\t编号\tA 原始值\tB 原始值\t差值 B−A\t绝对差\t状态':'参数\t侧别 / 槽位\t编号\t原始数值');
      for(const row of part.rows){
        const values=[row.field+(row.pending?'（待校对）':''),row.side,row.key];
        if(compare)values.push(row.a===undefined?'未记录':display(row.a,row.id),row.b===undefined?'未记录':display(row.b,row.id),row.delta===null?'—':signed(row.delta),row.absolute===null?'—':row.absolute,row.state==='same'?'相同':row.state==='changed'?'不同':row.state==='missingA'?'仅 B 有':'仅 A 有');
        else values.push(display(row.value,row.id));
        lines.push(values.join('\t'));
      }
    }
  }
}
function reportText(report){
  const lines=['捏脸数据分析报告',`模式：${report.mode==='compare'?'双码对比':'单码提取'}`,`口令码 A：${report.codeA}`];
  if(report.mode==='compare'){
    lines.push(`口令码 B：${report.codeB}`,'',comparisonSummary(report.stats),'','【全部参数明细】');
    appendReportRows(lines,report.stats.rows,true);
  }else{
    lines.push('',`共 ${report.recordsA.length} 个参数记录，${report.rows.length} 个槽位。`,'','【全部参数明细】');
    appendReportRows(lines,report.rows,false);
  }
  return lines.join('\n');
}
function resetResult(){currentReport=null;ui.result.hidden=true;ui.copyText.hidden=true;ui.copyText.value='';ui.status.className='';ui.status.textContent='';}
function clearFieldStatus(name){$(`status-${name}`).textContent='';$(`status-${name}`).className='field-status';ui[name].removeAttribute('aria-invalid');}
function setBusy(value){
  busy=value;
  for(const control of [ui.a,ui.b,ui.submit,ui.only,ui.sort,ui.copy,$('mode-compare'),$('mode-single')])control.disabled=value;
  ui.submit.textContent=value?(mode==='compare'?'正在对比…':'正在提取…'):(mode==='compare'?'一键对比':'提取数值');
}
function setMode(next){
  if(busy||mode===next)return;mode=next;resetResult();clearFieldStatus('a');clearFieldStatus('b');
  $('mode-compare').setAttribute('aria-pressed',String(mode==='compare'));$('mode-single').setAttribute('aria-pressed',String(mode==='single'));
  $('input-b').hidden=mode==='single';$('input-grid').classList.toggle('single',mode==='single');
  $('label-a').textContent=mode==='single'?'口令码':'口令码 A';ui.a.placeholder='粘贴口令码…';ui.submit.textContent=mode==='single'?'提取数值':'一键对比';
}
$('mode-compare').addEventListener('click',()=>setMode('compare'));
$('mode-single').addEventListener('click',()=>setMode('single'));
ui.only.addEventListener('change',renderTable);ui.sort.addEventListener('change',renderTable);
for(const name of ['a','b'])ui[name].addEventListener('input',()=>{if(busy)return;resetResult();clearFieldStatus(name);});
async function readInput(name,value){
  const label=name.toUpperCase(),fieldStatus=$(`status-${name}`);fieldStatus.textContent='读取中…';
  try{const records=await extractShare(value);fieldStatus.textContent='';return records;}
  catch(error){fieldStatus.className='field-status error';fieldStatus.textContent=`${label}：${error.message||'读取失败。'}`;ui[name].setAttribute('aria-invalid','true');throw error;}
}
ui.form.addEventListener('submit',async event=>{
  event.preventDefault();if(busy)return;resetResult();clearFieldStatus('a');clearFieldStatus('b');setBusy(true);
  const codeA=ui.a.value.trim(),codeB=ui.b.value.trim();ui.status.textContent='';
  try{
    const responses=await Promise.allSettled(mode==='compare'?[readInput('a',codeA),readInput('b',codeB)]:[readInput('a',codeA)]);
    if(responses.some(response=>response.status==='rejected')){ui.status.className='error';ui.status.textContent=mode==='compare'?'对比失败':'提取失败';return;}
    const recordsA=responses[0].value;
    if(mode==='compare'){
      const recordsB=responses[1].value;currentReport={mode,codeA,codeB,recordsA,recordsB,stats:compareRecords(recordsA,recordsB)};renderComparison(currentReport);
      ui.status.textContent='';
    }else{currentReport={mode,codeA,recordsA,rows:flattenRecords(recordsA)};renderSingle(currentReport);ui.status.textContent='';}
    ui.result.hidden=false;
  }catch(error){currentReport=null;ui.result.hidden=true;ui.status.className='error';ui.status.textContent=error.message||'分析失败，请重试。';}
  finally{setBusy(false);}
});
ui.copy.addEventListener('click',async()=>{
  if(!currentReport||busy)return;const value=reportText(currentReport);ui.copy.disabled=true;
  const helper=element('textarea');helper.value=value;helper.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.append(helper);helper.focus();helper.select();
  let ok=false;try{ok=document.execCommand('copy');}catch{}helper.remove();
  if(!ok&&navigator.clipboard?.writeText)try{await navigator.clipboard.writeText(value);ok=true;}catch{}
  ui.copyText.hidden=ok;if(!ok){ui.copyText.value=value;ui.copyText.focus();ui.copyText.select();}
  ui.status.className=ok?'':'error';ui.status.textContent=ok?'已复制':'请手动复制下方报告';ui.copy.disabled=busy;
});
})();
</script>
