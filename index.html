<body>
<main>
  <header>
    <h1>捏脸数据对比</h1>
  </header>
  <div class="mode-switch" role="group" aria-label="分析模式">
    <button id="mode-compare" type="button" aria-pressed="true">双码对比</button>
    <button id="mode-single" type="button" aria-pressed="false">单码提取</button>
  </div>
  <form id="form" class="input-card">
    <div id="input-grid" class="input-grid">
      <div>
        <label class="input-label" for="code-a"><span class="letter" aria-hidden="true">A</span><span id="label-a">口令码 A</span></label>
        <textarea id="code-a" spellcheck="false" autocomplete="off" placeholder="粘贴口令码…" aria-describedby="status-a"></textarea>
        <p id="status-a" class="field-status" role="status" aria-live="polite"></p>
      </div>
      <div id="input-b">
        <label class="input-label" for="code-b"><span class="letter letter-b" aria-hidden="true">B</span>口令码 B</label>
        <textarea id="code-b" spellcheck="false" autocomplete="off" placeholder="粘贴口令码…" aria-describedby="status-b"></textarea>
        <p id="status-b" class="field-status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="form-actions">
      <button id="submit" class="primary-action" type="submit">一键对比</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-label="分析结果">
    <div class="panel">
      <div class="section-heading">
        <h2 id="result-title">对比结果</h2>
        <button id="copy-all" class="secondary" type="button">复制完整报告</button>
      </div>
      <div id="comparison-summary">
        <div class="score-layout">
          <div class="score-card">
            <p class="score-label">相似度（参数一致率）</p>
            <p id="score" class="score-value"></p>
            <p id="score-note" class="score-note"></p>
          </div>
          <dl class="metrics">
            <div class="metric"><dt>相同参数</dt><dd id="same-count"></dd></div>
            <div class="metric"><dt>不同参数</dt><dd id="changed-count"></dd></div>
            <div class="metric"><dt>缺失参数</dt><dd id="missing-count"></dd><small id="missing-note"></small></div>
            <div class="metric"><dt>共有参数</dt><dd id="common-count"></dd></div>
            <div class="metric"><dt>共有覆盖率</dt><dd id="coverage"></dd></div>
            <div class="metric"><dt>平均原始差</dt><dd id="mean-difference"></dd></div>
          </dl>
        </div>
        <p id="summary-text" class="summary-text"></p>
        <details id="calculation-details"><summary>计算过程</summary><pre id="calculation" class="calculation"></pre></details>
      </div>
      <textarea id="copy-text" hidden readonly aria-label="完整报告，可手动复制"></textarea>
    </div>
    <div class="panel detail-panel">
      <div class="table-top">
        <div class="section-heading"><h2 id="detail-title">参数明细</h2><span id="table-count" class="hint"></span></div>
        <div id="table-controls" class="table-controls">
          <label class="check-label"><input id="differences-only" type="checkbox" checked>只看差异与缺失</label>
          <label class="select-label" for="sort-order">排序<select id="sort-order"><option value="difference">绝对差从大到小</option><option value="part">部位顺序</option></select></label>
        </div>
      </div>
      <div class="table-scroll"><table id="data-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
    </div>
  </section>
</main>

function parseRecords(bytes){let out=[],seen=new Set(),p=0;while(p<bytes.length){if(p+3>bytes.length)throw new DataError('数据记录不完整。');let group=bytes[p++],control=bytes[p++],count=bytes[p++];if(!count||p+count*2>bytes.length)throw new DataError('数值区段不完整。');let slots={};for(let i=0;i<count;i++){let slot=String(bytes[p++]),v=bytes[p++];if(Object.hasOwn(slots,slot))throw new DataError('存在重复槽位。');slots[slot]=v}let id=`${group}:${control}`;if(seen.has(id))throw new DataError('存在重复编号。');seen.add(id);out.push({group,control,slots});if(out.length>2048)throw new DataError('数据量过大。')}if(!out.length)throw new DataError('未读取到参数。');return out}
async function unpack(encoded){if(!('DecompressionStream' in window))throw new DataError('请使用新版浏览器。');let binary;try{binary=atob(encoded)}catch{throw new DataError('编码不完整。')}let bytes=Uint8Array.from(binary,(ch,i)=>ch.charCodeAt(0)^key[i%key.length]);try{let reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')).getReader(),chunks=[],size=0;while(true){let {done,value}=await reader.read();if(done)break;size+=value.length;if(size>1048576){await reader.cancel();throw new DataError('解包数据过大。')}chunks.push(value)}let out=new Uint8Array(size),p=0;for(let c of chunks){out.set(c,p);p+=c.length}return out}catch(e){throw e instanceof DataError?e:new DataError('数据校验失败或格式不支持。')}}
async function decodeShare(share){if(typeof share?.face_data!=='string')throw new DataError('数据格式不正确。');let parts=share.face_data.trim().split('|*|'),fmt=parts[0]?.slice(0,3);if(fmt!=='R67')throw new DataError(`仅支持 R67 数据格式，当前为 ${fmt||'未知'}。`);if(parts.length!==5&&parts.length!==6)throw new DataError('数据区段不完整。');let records=parseRecords(await unpack(parts[0].slice(3)));for(let part of [parts[1],parts[2],...parts.slice(4)])await unpack(part);if(!/^\d+$/.test(parts[3]))throw new DataError('附加标记不完整。');return records}
async function extractShare(input){let s=input.trim();if(!s)throw new DataError('请粘贴完整数据。');if(s.length>10000)throw new DataError('输入过长。');let match=s.match(/yysls_facedata_R\d+_([A-Za-z0-9]{24,90})/);if(!match)throw new DataError('未识别到标准长格式数据。');let last;for(let source of sources){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{let res=await fetch(source+match[1],{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer',mode:'cors'});if(!res.ok){last=new DataError(res.status===404?'分享数据已失效。':'数据来源暂不可用。','NETWORK');continue}let text=await res.text();if(text.length>1048576)throw new DataError('文件超出预期大小。');let share;try{share=JSON.parse(text)}catch{throw new DataError('返回数据格式错误。')}return await decodeShare(share)}catch(e){if(e instanceof DataError&&e.code!=='NETWORK')throw e;last=e}finally{clearTimeout(timer)}}throw last instanceof DataError?last:new DataError('网络读取失败，请稍后再试。')}

const $=id=>document.getElementById(id);
const ui={form:$('form'),a:$('code-a'),b:$('code-b'),submit:$('submit'),result:$('result'),status:$('status'),copy:$('copy-all'),copyText:$('copy-text'),only:$('differences-only'),sort:$('sort-order')};
let mode='compare',busy=false,currentReport=null;

function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function partOrder(a,b){return a.order-b.order||a.fieldOrder-b.fieldOrder||a.group-b.group||a.control-b.control||Number(a.slot)-Number(b.slot);}
function flattenRecords(records){
  const rows=[];
  for(const record of records){
    const id=`${record.group}:${record.control}`,group=groupMap.get(record.group),field=fieldMap.get(id);
    for(const [slot,value] of Object.entries(record.slots)){
      const side=field&&bilateral.has(record.group)&&(slot==='1'||slot==='2')?(slot==='1'?'左':'右'):`槽位 ${slot}`;
      rows.push({key:`${id}:${slot}`,id,group:record.group,control:record.control,slot,value,side,part:group?.name||`未对应部位 ${record.group}`,field:field?.name||`参数 ${record.control}`,pending:!field||!!field.reason,order:group?.order??999,fieldOrder:field?.order??999});
    }
  }
  return rows.sort(partOrder);
}
function compareRecords(recordsA,recordsB){
  const a=new Map(flattenRecords(recordsA).map(row=>[row.key,row])),b=new Map(flattenRecords(recordsB).map(row=>[row.key,row]));
  const stats={rows:[],same:0,changed:0,onlyA:0,onlyB:0,common:0,total:0,totalDifference:0,groups:[],countA:a.size,countB:b.size};
  const groups=new Map();
  for(const key of new Set([...a.keys(),...b.keys()])){
    const rowA=a.get(key),rowB=b.get(key),meta=rowA||rowB;
    const row={...meta,a:rowA?.value,b:rowB?.value,delta:null,absolute:null,state:''};
    if(!rowA){row.state='missingA';stats.onlyB++;}
    else if(!rowB){row.state='missingB';stats.onlyA++;}
    else{
      row.delta=row.b-row.a;row.absolute=Math.abs(row.delta);stats.common++;stats.totalDifference+=row.absolute;
      row.state=row.absolute===0?'same':'changed';stats[row.state]++;
      if(!groups.has(row.group))groups.set(row.group,{group:row.group,part:row.part,sum:0,changed:0});
      const group=groups.get(row.group);group.sum+=row.absolute;if(row.absolute>0)group.changed++;
    }
    stats.rows.push(row);
  }
  stats.rows.sort(partOrder);stats.total=stats.rows.length;
  stats.groups=[...groups.values()].filter(group=>group.sum>0).sort((a,b)=>b.sum-a.sum||a.group-b.group);
  return stats;
}
function percentage(numerator,denominator){
  if(!denominator)return '无法计算';
  const value=numerator/denominator*100;
  if(numerator>0&&value<.005)return '<0.01%';
  if(numerator<denominator&&value>=99.995)return '>99.99%';
  return `${value.toFixed(2)}%`;
}
function meanDifference(stats){return stats.common?(stats.totalDifference/stats.common).toFixed(3):'无法计算';}
function signed(value){return value>0?`+${value}`:String(value);}
function rowLabel(row){return `${row.part} / ${row.field}${row.pending?'（待校对）':''} / ${row.side} [${row.key}]`;}
function comparisonSummary(stats){
  if(!stats.common)return '无共有参数，无法计算。';
  if(!stats.changed)return stats.onlyA+stats.onlyB?'共有参数一致。':'全部参数一致。';
  const group=stats.groups[0];
  return `差异最大：${group.part}（原始差合计 ${group.sum}）。`;
}
function calculationText(stats){
  const lines=[
    `A ${stats.countA} 项，B ${stats.countB} 项，共有 ${stats.common} 项，并集 ${stats.total} 项。`,
    `相同 ${stats.same} 项，不同 ${stats.changed} 项；仅 A ${stats.onlyA} 项，仅 B ${stats.onlyB} 项。`,
    '',
    '相似度（参数一致率）= 相同项 ÷ 共有项 × 100%',
    stats.common?`${stats.same} ÷ ${stats.common} × 100% = ${percentage(stats.same,stats.common)}`:'无共有项，无法计算。',
    '',
    '覆盖率 = 共有项 ÷ 并集 × 100%',
    `${stats.common} ÷ ${stats.total} × 100% = ${percentage(stats.common,stats.total)}`,
    '',
    '平均原始差 = Σ|B − A| ÷ 共有项',
    stats.common?`${stats.totalDifference} ÷ ${stats.common} = ${meanDifference(stats)}`:'无共有项，无法计算。',
    '',
    '按部位、参数、槽位对齐；左右分别比较。使用原始值，缺失项不计分。'
  ];
  const examples=stats.rows.filter(row=>row.absolute!==null).sort((a,b)=>b.absolute-a.absolute||partOrder(a,b)).slice(0,2);
  if(examples.length)lines.push('','差值示例：');
  for(const row of examples)lines.push(`${rowLabel(row)}：|${row.b} − ${row.a}| = ${row.absolute}`);
  return lines.join('\n');
}
function valueCell(value,id){
  const cell=element('td',value===undefined?'未记录':String(value),'numeric');
  if(value!==undefined&&verified.get(id)?.[value]!==undefined)cell.append(element('span',`界面 ${verified.get(id)[value]}`,'calibrated'));
  return cell;
}
function appendMetadata(tr,row){
  tr.append(element('td',row.part));
  const parameter=element('td',row.field);
  if(row.pending)parameter.append(element('span','待校对','row-badge'));
  parameter.append(element('span',row.key,'row-id'));tr.append(parameter,element('td',row.side));
}
function renderTable(){
  if(!currentReport)return;
  const compare=currentReport.mode==='compare',stats=currentReport.stats;
  let rows=compare?stats.rows.slice():currentReport.rows.slice();
  if(compare&&ui.only.checked)rows=rows.filter(row=>row.state!=='same');
  if(compare&&ui.sort.value==='difference')rows.sort((a,b)=>(b.absolute??-1)-(a.absolute??-1)||partOrder(a,b));
  else rows.sort(partOrder);
  const header=element('tr');
  for(const [index,title] of (compare?['部位','参数 / 编号','侧别 / 槽位','A 原始值','B 原始值','差值 B − A']:['部位','参数 / 编号','侧别 / 槽位','原始数值']).entries()){
    const th=element('th',title,index>=3?'numeric':'');th.scope='col';header.append(th);
  }
  $('table-head').replaceChildren(header);$('data-table').classList.toggle('single-table',!compare);
  const fragment=document.createDocumentFragment();
  for(const row of rows){
    const tr=element('tr');if(compare&&row.state!=='same')tr.className=row.absolute===null?'missing':'changed';
    appendMetadata(tr,row);
    if(compare){tr.append(valueCell(row.a,row.id),valueCell(row.b,row.id),element('td',row.delta===null?'—':signed(row.delta),'numeric delta'));}
    else tr.append(valueCell(row.value,row.id));
    fragment.append(tr);
  }
  if(!rows.length){
    const td=element('td',compare&&ui.only.checked?'无差异':'无参数','empty-row');td.colSpan=compare?6:4;const tr=element('tr');tr.append(td);fragment.append(tr);
  }
  $('table-body').replaceChildren(fragment);
  $('table-count').textContent=compare?`显示 ${rows.length} / ${stats.total} 项`:`共 ${rows.length} 个槽位`;
}
function renderComparison(report){
  const stats=report.stats,missing=stats.onlyA+stats.onlyB;
  $('result-title').textContent='对比结果';
  $('comparison-summary').hidden=false;$('table-controls').hidden=false;
  $('score').textContent=percentage(stats.same,stats.common);
  $('score-note').textContent=missing?`缺失 ${missing} 项，仅比较共有参数。`:'';
  $('same-count').textContent=stats.same;$('changed-count').textContent=stats.changed;$('missing-count').textContent=missing;
  $('missing-note').textContent=`仅 A：${stats.onlyA} · 仅 B：${stats.onlyB}`;$('common-count').textContent=stats.common;
  $('coverage').textContent=percentage(stats.common,stats.total);$('mean-difference').textContent=stats.common?meanDifference(stats):'—';
  $('summary-text').textContent=comparisonSummary(stats);$('calculation').textContent=calculationText(stats);
  $('detail-title').textContent='参数明细';
  $('calculation-details').open=false;ui.only.checked=true;ui.sort.value='difference';renderTable();
}
function renderSingle(report){
  $('result-title').textContent='提取结果';
  $('comparison-summary').hidden=true;$('table-controls').hidden=true;
  $('detail-title').textContent='参数明细';renderTable();
}
function reportText(report){
  const lines=['捏脸数据分析报告',`模式：${report.mode==='compare'?'双码对比':'单码提取'}`,`口令码 A：${report.codeA}`];
  if(report.mode==='compare'){
    const stats=report.stats;lines.push(`口令码 B：${report.codeB}`,'',`参数相似度（按共有槽位完全一致率）：${percentage(stats.same,stats.common)}`,`相同 ${stats.same} 项，不同 ${stats.changed} 项，缺失 ${stats.onlyA+stats.onlyB} 项（仅 A ${stats.onlyA}，仅 B ${stats.onlyB}）`,
      `共有 ${stats.common} 项，并集 ${stats.total} 项，覆盖率 ${percentage(stats.common,stats.total)}`,`平均原始差：${meanDifference(stats)}`,'',comparisonSummary(stats),'','【相似度计算过程】',calculationText(stats),'','【全部参数明细】','部位\t参数\t侧别 / 槽位\t编号\tA 原始值\tB 原始值\t差值 B−A\t绝对差\t状态');
    for(const row of stats.rows)lines.push([row.part,row.field+(row.pending?'（待校对）':''),row.side,row.key,row.a===undefined?'未记录':display(row.a,row.id),row.b===undefined?'未记录':display(row.b,row.id),row.delta===null?'—':signed(row.delta),row.absolute===null?'—':row.absolute,row.state==='same'?'相同':row.state==='changed'?'不同':row.state==='missingA'?'仅 B 有':'仅 A 有'].join('\t'));
  }else{
    lines.push('',`共 ${report.recordsA.length} 个参数记录，${report.rows.length} 个槽位。`,'','【全部参数明细】','部位\t参数\t侧别 / 槽位\t编号\t原始数值');
    for(const row of report.rows)lines.push([row.part,row.field+(row.pending?'（待校对）':''),row.side,row.key,display(row.value,row.id)].join('\t'));
  }
  return lines.join('\n');
}
function resetResult(){currentReport=null;ui.result.hidden=true;ui.copyText.hidden=true;ui.copyText.value='';ui.status.className='';ui.status.textContent='';}
function clearFieldStatus(name){$(`status-${name}`).textContent='';$(`status-${name}`).className='field-status';ui[name].removeAttribute('aria-invalid');}
function setBusy(value){
  busy=value;
  for(const control of [ui.a,ui.b,ui.submit,ui.only,ui.sort,ui.copy,$('mode-compare'),$('mode-single')])control.disabled=value;
  ui.submit.textContent=value?(mode==='compare'?'正在对比…':'正在提取…'):(mode==='compare'?'一键对比':'提取数值');
}
function setMode(next){
  if(busy||mode===next)return;mode=next;resetResult();clearFieldStatus('a');clearFieldStatus('b');
  $('mode-compare').setAttribute('aria-pressed',String(mode==='compare'));$('mode-single').setAttribute('aria-pressed',String(mode==='single'));
  $('input-b').hidden=mode==='single';$('input-grid').classList.toggle('single',mode==='single');
  $('label-a').textContent=mode==='single'?'口令码':'口令码 A';ui.a.placeholder='粘贴口令码…';ui.submit.textContent=mode==='single'?'提取数值':'一键对比';
}
$('mode-compare').addEventListener('click',()=>setMode('compare'));
$('mode-single').addEventListener('click',()=>setMode('single'));
ui.only.addEventListener('change',renderTable);ui.sort.addEventListener('change',renderTable);
for(const name of ['a','b'])ui[name].addEventListener('input',()=>{if(busy)return;resetResult();clearFieldStatus(name);});
async function readInput(name,value){
  const label=name.toUpperCase(),fieldStatus=$(`status-${name}`);fieldStatus.textContent='读取中…';
  try{const records=await extractShare(value);fieldStatus.textContent='';return records;}
  catch(error){fieldStatus.className='field-status error';fieldStatus.textContent=`${label}：${error.message||'读取失败。'}`;ui[name].setAttribute('aria-invalid','true');throw error;}
}
ui.form.addEventListener('submit',async event=>{
  event.preventDefault();if(busy)return;resetResult();clearFieldStatus('a');clearFieldStatus('b');setBusy(true);
  const codeA=ui.a.value.trim(),codeB=ui.b.value.trim();ui.status.textContent='';
  try{
    const responses=await Promise.allSettled(mode==='compare'?[readInput('a',codeA),readInput('b',codeB)]:[readInput('a',codeA)]);
    if(responses.some(response=>response.status==='rejected')){ui.status.className='error';ui.status.textContent=mode==='compare'?'对比失败':'提取失败';return;}
    const recordsA=responses[0].value;
    if(mode==='compare'){
      const recordsB=responses[1].value;currentReport={mode,codeA,codeB,recordsA,recordsB,stats:compareRecords(recordsA,recordsB)};renderComparison(currentReport);
      ui.status.textContent='';
    }else{currentReport={mode,codeA,recordsA,rows:flattenRecords(recordsA)};renderSingle(currentReport);ui.status.textContent='';}
    ui.result.hidden=false;
  }catch(error){currentReport=null;ui.result.hidden=true;ui.status.className='error';ui.status.textContent=error.message||'分析失败，请重试。';}
  finally{setBusy(false);}
});
ui.copy.addEventListener('click',async()=>{
  if(!currentReport||busy)return;const value=reportText(currentReport);ui.copy.disabled=true;
  const helper=element('textarea');helper.value=value;helper.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.append(helper);helper.focus();helper.select();
  let ok=false;try{ok=document.execCommand('copy');}catch{}helper.remove();
  if(!ok&&navigator.clipboard?.writeText)try{await navigator.clipboard.writeText(value);ok=true;}catch{}
  ui.copyText.hidden=ok;if(!ok){ui.copyText.value=value;ui.copyText.focus();ui.copyText.select();}
  ui.status.className=ok?'':'error';ui.status.textContent=ok?'已复制':'请手动复制下方报告';ui.copy.disabled=busy;
});
})();
</script>
